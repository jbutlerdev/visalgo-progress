<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>visalgo · algo-developer progress</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--tx:#e6edf3;--mut:#8b949e;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{padding:22px 28px;border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
h1{font-size:19px;margin:0}h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:12px}
#stats{display:flex;gap:10px;flex-wrap:wrap;padding:16px 28px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 16px;min-width:110px}
.stat b{font-size:20px;display:block}.stat span{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
#runs{padding:18px 28px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.run{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.run h3{margin:0 0 6px;font-size:15px}
.meta{color:var(--mut);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd)}
.ok{color:var(--ok);border-color:var(--ok)}.partial{color:var(--warn);border-color:var(--warn)}.blocked,.failed{color:var(--bad);border-color:var(--bad)}
.run p{margin:6px 0 0;white-space:pre-wrap}
a{color:var(--acc);text-decoration:none}
.empty{color:var(--mut);padding:40px 28px}
</style></head><body>
<header><h1>visalgo <span>·</span> algo-developer</h1><div class="sub">herd agent progress — runs logged in <a href="https://github.com/jbutlerdev/visalgo-progress/tree/main/runs">/runs</a> · source: private repo · <span id="updated"></span></div></header>
<div id="stats"></div><div id="runs"><div class="empty">loading…</div></div>
<script>
fetch('data/runs.json?ts='+Date.now()).then(r=>r.json()).then(rs=>{
  rs=(rs||[]).slice().sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  const now=Date.now(),d24=now-864e5,d7=now-6048e5;
  const cnt=(f)=>rs.filter(r=>(r.ts&&+new Date(r.ts)>=f)).length;
  document.getElementById('stats').innerHTML=[
    ['total runs',rs.length],['last 24h',cnt(d24)],['last 7d',cnt(d7)],
    ['experiments',rs.reduce((a,r)=>a+(r.experiments||0),0)],
    ['deploys',rs.filter(r=>r.type==='deploy').length],
    ['last run',rs[0]?new Date(rs[0].ts).toLocaleString():'—']
  ].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
  document.getElementById('updated').textContent='updated '+new Date().toLocaleTimeString();
  document.getElementById('runs').innerHTML=rs.length?rs.map(r=>`<div class="run">
    <h3>${r.title||r.id}</h3>
    <div class="meta"><span>${r.ts?new Date(r.ts).toLocaleString():''}</span>
    <span class="badge ${r.status||'ok'}">${r.status||'ok'}</span>
    ${r.type&&r.type!=='wake'?`<span class="badge">${r.type}</span>`:''}
    ${r.tests&&r.tests!=='n/a'?`<span class="badge">tests:${r.tests}</span>`:''}
    ${r.sierra&&r.sierra!=='none'?`<span class="badge">sierra:${r.sierra}</span>`:''}</div>
    <p>${(r.summary||'').replace(/</g,'&lt;')}</p>
    ${r.file?`<p><a href="https://github.com/jbutlerdev/visalgo-progress/blob/main/${r.file}">full log ↗</a></p>`:''}
  </div>`).join(''):'<div class="empty">no runs logged yet — first wake will populate this.</div>';
}).catch(e=>document.getElementById('runs').innerHTML='<div class="empty">runs.json unavailable: '+e+'</div>');
</script></body></html>
