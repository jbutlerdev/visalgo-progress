<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>visalgo · algo performance</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--tx:#e6edf3;--mut:#8b949e;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{padding:22px 28px;border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
h1{font-size:19px;margin:0}h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:12px}
#stats{display:flex;gap:10px;flex-wrap:wrap;padding:16px 28px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 16px;min-width:110px}
.stat b{font-size:20px;display:block}.stat span{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
#runs{padding:18px 28px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.run{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.run h3{margin:0 0 6px;font-size:15px}
.meta{color:var(--mut);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd)}
.ok{color:var(--ok);border-color:var(--ok)}.partial{color:var(--warn);border-color:var(--warn)}.blocked,.failed{color:var(--bad);border-color:var(--bad)}
.run>p.summary{margin:6px 0 0;white-space:pre-wrap}
a{color:var(--acc);text-decoration:none}
.empty{color:var(--mut);padding:40px 28px}
.algos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.algo{border:1px solid var(--bd);border-radius:8px;padding:10px;background:#0d1117}
.algo h4{margin:0 0 6px;font-size:13px;color:var(--acc)}
svg.eq{width:100%;height:110px;display:block}
text.ax{font-size:8px;fill:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:10.5px;background:#21262d;border:1px solid var(--bd);border-radius:8px;padding:1px 7px;color:var(--tx)}
.chip b{color:var(--mut);font-weight:600}
details.params{margin-top:6px;font-size:12px}
details.params summary{color:var(--mut);cursor:pointer;font-size:11px}
table.p{border-collapse:collapse;width:100%;margin-top:4px}
table.p td{border-bottom:1px solid #21262d;padding:2px 6px;vertical-align:top}
table.p td:first-child{color:var(--mut);white-space:nowrap}
.noeq{color:var(--mut);font-size:11px;padding:30px 0;text-align:center;border:1px dashed var(--bd);border-radius:6px}
</style></head><body>
<header><h1>visalgo <span>·</span> algo performance</h1><div class="sub">equity curves, params &amp; metrics per run — logged in <a href="https://github.com/jbutlerdev/visalgo-progress/tree/main/runs">/runs</a> · source: private repo · <span id="updated"></span></div></header>
<div id="stats"></div><div id="runs"><div class="empty">loading…</div></div>
<script>
function downsample(a,max){if(a.length<=max)return a;const o=[],s=(a.length-1)/(max-1);for(let i=0;i<max;i++)o.push(a[Math.round(i*s)]);return o}
function eqSvg(eq){
  const w=300,h=112,pts=downsample((eq||[]).filter(p=>Array.isArray(p)&&isFinite(p[1])),400);
  if(pts.length<2)return'<div class="noeq">no equity curve</div>';
  const vs=pts.map(p=>p[1]);let lo=Math.min(0,...vs),hi=Math.max(0,...vs);if(hi===lo)hi=lo+1;
  const pad=(hi-lo)*.08;lo-=pad;hi+=pad;
  const X=i=>(i/(pts.length-1))*(w-56)+48,Y=v=>h-14-((v-lo)/(hi-lo))*(h-26);
  const P=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
  const A=`${P}L${X(pts.length-1).toFixed(1)},${Y(lo).toFixed(1)}L${X(0).toFixed(1)},${Y(lo).toFixed(1)}Z`;
  const last=vs[vs.length-1],col=last>=0?'#3fb950':'#f85149';
  const f=v=>Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':(+v).toFixed(v%1?2:0);
  return`<svg class="eq" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${A}" fill="${col}" opacity=".12"/><path d="${P}" fill="none" stroke="${col}" stroke-width="1.6"/><line x1="48" x2="${w-6}" y1="${Y(0)}" y2="${Y(0)}" stroke="#8b949e" stroke-dasharray="3 3" stroke-width=".7"/><text class="ax" x="4" y="${(Y(hi)+6).toFixed(0)}">${f(hi)}</text><text class="ax" x="4" y="${(Y(0)+3).toFixed(0)}">0</text><text class="ax" x="4" y="${(Y(lo)+8).toFixed(0)}">${f(lo)}</text><text x="${w-6}" y="10" text-anchor="end" class="ax" fill="${col}">${last>=0?'+':''}${f(last)}</text></svg>`}
function fmt(v){if(typeof v==='number')return Math.abs(v)>=1000?v.toLocaleString(undefined,{maximumFractionDigits:0}):(+v).toFixed(Math.abs(v)<1&&v%1?3:2);return String(v)}
function algoCard(a){
  const m=a.metrics||{},chips=Object.entries(m).map(([k,v])=>`<span class="chip"><b>${k}</b> ${fmt(v)}</span>`).join('');
  const p=Object.entries(a.params||{});
  const pt=p.length?`<details class="params" ${p.length<=7?'open':''}><summary>params (${p.length})</summary><table class="p">${p.map(([k,v])=>`<tr><td>${k}</td><td>${typeof v==='object'?JSON.stringify(v):v}</td></tr>`).join('')}</table></details>`:'';
  return`<div class="algo"><h4>${a.name||'algo'}</h4>${eqSvg(a.equity)}<div class="chips">${chips}</div>${pt}</div>`}
fetch('data/runs.json?ts='+Date.now()).then(r=>r.json()).then(rs=>{
  rs=(rs||[]).slice().sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  const work=rs.filter(r=>r.type!=='example');
  const now=Date.now(),d24=now-864e5,d7=now-6048e5;
  const cnt=f=>work.filter(r=>r.ts&&+new Date(r.ts)>=f).length;
  const algos=new Set();work.forEach(r=>(r.algos||[]).forEach(a=>algos.add(a.name)));
  document.getElementById('stats').innerHTML=[
    ['runs',work.length],['last 24h',cnt(d24)],['last 7d',cnt(d7)],
    ['algos tracked',algos.size],['deploys',work.filter(r=>r.type==='deploy').length],
    ['last run',work[0]?new Date(work[0].ts).toLocaleString():'—']
  ].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
  document.getElementById('updated').textContent='updated '+new Date().toLocaleTimeString();
  document.getElementById('runs').innerHTML=rs.length?rs.map(r=>`<div class="run">
    <h3>${r.title||r.id}${r.type==='example'?' <span class="badge">example</span>':''}</h3>
    <div class="meta"><span>${r.ts?new Date(r.ts).toLocaleString():''}</span>
    <span class="badge ${r.status||'ok'}">${r.status||'ok'}</span>
    ${r.type&&r.type!=='wake'?`<span class="badge">${r.type}</span>`:''}
    ${r.tests&&r.tests!=='n/a'?`<span class="badge">tests:${r.tests}</span>`:''}
    ${r.sierra&&r.sierra!=='none'?`<span class="badge">sierra:${r.sierra}</span>`:''}</div>
    ${(r.algos&&r.algos.length)?`<div class="algos">${r.algos.map(algoCard).join('')}</div>`:''}
    <p class="summary">${(r.summary||'').replace(/</g,'&lt;')}</p>
    ${r.file?`<p><a href="https://github.com/jbutlerdev/visalgo-progress/blob/main/${r.file}">full log ↗</a></p>`:''}
  </div>`).join(''):'<div class="empty">no runs logged yet.</div>';
}).catch(e=>document.getElementById('runs').innerHTML='<div class="empty">runs.json unavailable: '+e+'</div>');
</script></body></html>
